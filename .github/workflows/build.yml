name: Build & release v1

on:
  push:
    branches: [main, ccr-4bbc04df-4qqdpz]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      # The app downloads this on first launch (see FfmpegManager.kt).
      # Android-native ffmpeg from Termux's package repo, plus the shared libs it needs.
      - name: Package ffmpeg for Android
        run: python3 scripts/package_ffmpeg.py ffmpeg-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Convertapity-release
          path: app/build/outputs/apk/release/app-release.apk

      # Publish APK + ffmpeg binary as the v1 release (re-created at the current commit each run)
      - name: Publish v1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Convertapity-v1.apk
          gh release delete v1 --cleanup-tag --yes || true
          gh release create v1 Convertapity-v1.apk ffmpeg-arm64.zip \
            --target "$GITHUB_SHA" \
            --title "Convertapity v1" \
            --notes "Install Convertapity-v1.apk. The app downloads ffmpeg-arm64.zip from this release on first launch."
